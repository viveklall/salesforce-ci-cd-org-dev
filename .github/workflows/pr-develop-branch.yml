name: Validate PR on develop branch

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
    paths:
      - "force-app/**"

# Needed by github/codeql-action/upload-sarif.
permissions:
  contents: read
  security-events: write

jobs:
  validate-deployment-on-develop-org:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    env:
      # Always invoke the CLI installed by this workflow, never a runner-preinstalled one.
      SF_CLI: ${{ runner.temp }}/sf-cli/node_modules/.bin/sf

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Current Salesforce CLI dependencies require the Node 22 runtime.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Node.js runtime
        shell: bash
        run: |
          node --version
          npm --version
          test "$(node -p 'process.versions.node.split(".")[0]')" -ge 22

      - name: Read PR body
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > pr_body.txt
          node ./parsePR.js
          echo "APEX_TESTS=$(tr -d '\r\n' < testsToRun.txt)" >> "$GITHUB_ENV"

      # The legacy sfdx Linux archive URL is no longer a reliable installer.
      # Install the supported sf CLI package instead; it includes the sfdx alias
      # for compatibility, although this workflow uses sf commands below.
      - name: Install Salesforce CLI
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/sf-cli" @salesforce/cli
          "$SF_CLI" --version

      - name: Install sfdx-git-delta
        # sfdx-git-delta is unsigned and prompts for confirmation.
        run: echo y | "$SF_CLI" plugins install sfdx-git-delta

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Salesforce Code Analyzer
        run: "$SF_CLI" plugins install @salesforce/plugin-code-analyzer

      - name: Authenticate to Integration Org
        shell: bash
        env:
          SFDX_INTEGRATION_URL: ${{ secrets.SFDX_INTEGRATION_URL }}
        run: |
          printf '%s\n' "$SFDX_INTEGRATION_URL" > SFDX_INTEGRATION_URL.txt
          "$SF_CLI" org login sfdx-url \
            --sfdx-url-file SFDX_INTEGRATION_URL.txt \
            --alias integration \
            --set-default
          rm SFDX_INTEGRATION_URL.txt

      - name: Create delta packages for new, modified, and deleted metadata
        run: |
          "$SF_CLI" sgd source delta \
            --to HEAD \
            --from "${{ github.event.pull_request.base.sha }}" \
            --output changed-sources \
            --generate-delta \
            --source force-app

      - name: Scan code
        run: |
          "$SF_CLI" code-analyzer run \
            --workspace changed-sources \
            --target 'changed-sources/force-app/**/*.cls' \
            --output-file changed-sources/apexScanResults.sarif

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: changed-sources/apexScanResults.sarif

      - name: Check-only deploy delta changes - run specified tests
        if: env.APEX_TESTS != 'all'
        run: |
          "$SF_CLI" project deploy start \
            --source-dir changed-sources/force-app \
            --dry-run \
            --test-level RunSpecifiedTests \
            --tests "${{ env.APEX_TESTS }}" \
            --target-org integration \
            --wait 60

      - name: Check-only deploy delta changes - run all tests
        if: env.APEX_TESTS == 'all'
        run: |
          "$SF_CLI" project deploy start \
            --source-dir changed-sources/force-app \
            --dry-run \
            --test-level RunLocalTests \
            --target-org integration \
            --wait 60

      - name: Deploy destructive changes (if any)
        shell: bash
        run: |
          if [ -f changed-sources/destructiveChanges/destructiveChanges.xml ]; then
            "$SF_CLI" project deploy start \
              --metadata-dir changed-sources/destructiveChanges \
              --dry-run \
              --ignore-warnings \
              --target-org integration \
              --wait 60
          fi