# Unique name for this workflow
name: Validate PR on develop branch

on:
  pull_request:
    types: [opened, synchronize]
    branches: [ develop ]
    paths:
      - 'force-app/**'

jobs:
  validate-deployment-on-develop-org:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' }}

    steps:
      # ✅ UPDATED: Node.js 20 (required for sfdx-git-delta)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Checkout full history (required for git-delta)
      - name: Checkout source code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Read PR body and extract tests
      - name: Read PR Body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "$PR_BODY" > ./pr_body.txt
          node ./parsePR.js
          TESTS=$(cat testsToRun.txt)
          echo "APEX_TESTS=$TESTS" >> $GITHUB_ENV

      # ✅ FIXED: Salesforce CLI install (PATH handled correctly)
      - name: Install Salesforce CLI
        run: |
          wget https://developer.salesforce.com/media/salesforce-cli/sfdx/channels/stable/sfdx-linux-x64.tar.xz
          mkdir -p ~/sfdx
          tar xJf sfdx-linux-x64.tar.xz -C ~/sfdx --strip-components 1
          echo "$HOME/sfdx/bin" >> $GITHUB_PATH
          $HOME/sfdx/bin/sfdx version

      # Install sfdx-git-delta (now compatible with Node 20)
      - name: Install sfdx-git-delta
        run: |
          echo y | sfdx plugins:install sfdx-git-delta
          sfdx plugins

      # Install Java (required for scanner)
      - name: Install Java
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jdk

      # Install Salesforce Scanner
      - name: Install SFDX Scanner
        run: sfdx plugins:install @salesforce/sfdx-scanner

      # Authenticate using SFDX auth URL secret
      - name: Populate auth file with SFDX_URL secret of integration org
        run: |
          echo "${{ secrets.SFDX_INTEGRATION_URL }}" > ./SFDX_INTEGRATION_URL.txt

      - name: Authenticate to Integration Org
        run: sfdx auth:sfdxurl:store -f ./SFDX_INTEGRATION_URL.txt -s -a integration

      # Create delta packages
      - name: Create delta packages for new, modified or deleted metadata
        run: |
          mkdir changed-sources
          sfdx sgd:source:delta \
            --from "HEAD^" \
            --to "HEAD" \
            --source force-app \
            --output changed-sources \
            --generate-delta

      # Run Apex static scan
      - name: Scan code
        run: |
          cd changed-sources
          sfdx scanner:run \
            --format sarif \
            --target './**/*.cls' \
            --category "Design,Best Practices,Performance" \
            --outfile apexScanResults.sarif
          cd ..

      # Upload scan results to GitHub
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v1
        with:
          sarif_file: changed-sources/apexScanResults.sarif

      # Check-only deploy – specified tests
      - name: Check-only deploy delta changes - run specified tests
        if: ${{ env.APEX_TESTS != 'all' }}
        run: |
          echo "Running tests: ${{ env.APEX_TESTS }}"
          sfdx force:source:deploy \
            -p changed-sources/force-app \
            --checkonly \
            --testlevel RunSpecifiedTests \
            --runtests ${{ env.APEX_TESTS }} \
            --json

      # Check-only deploy – all tests
      - name: Check-only deploy delta changes - run all tests
        if: ${{ env.APEX_TESTS == 'all' }}
        run: |
          sfdx force:source:deploy \
            -p changed-sources/force-app \
            --checkonly \
            --testlevel RunLocalTests \
            --json

      # Validate destructive changes
      - name: Deploy destructive changes (if any)
        run: |
          sfdx force:mdapi:deploy \
            -d changed-sources/destructiveChanges \
            --checkonly \
            --ignorewarnings
